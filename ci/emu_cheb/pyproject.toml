#This will only build on windows if symlinks are available for the readme and licence
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emu-cheb"
description = "Exact Chebyshev pulse emulator (state vector, quantum trajectories) with an emu-sv-style API, built on PyTorch"
readme = "README.md"
authors = [
    { name = "Igor Sokolov", email = "igor.sokolov@pasqal.com" },
    { name = "Mathieu Garrigues" },
]
requires-python = ">=3.11,<3.15"
license = {file = "LICENSE"}
classifiers=[
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]
dependencies = [
  "emu-base==2.10.0",
  "emu-sv==2.10.0",  # StateVector / DenseOperator for initial states, Expectation and Fidelity
  "scipy",
]

[project.optional-dependencies]
validation = ["emu-mps==2.10.0"]  # test/emu_cheb/validation compares against emu-mps

[project.urls]
Repository = "https://github.com/pasqal-io/emulators"
Issues = "https://github.com/pasqal-io/emulators/issues"

[tool.hatch.version]
path = "emu_cheb/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["emu_cheb"]
exclude = ["emu_cheb/**/__pycache__"]

[tool.hatch.metadata]
allow-direct-references = true
allow-ambiguous-features = true

[tool.coverage.run]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
